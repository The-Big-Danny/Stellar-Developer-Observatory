[package]
name = "sdo-probe"
description = "M0 feasibility probe: measures what a Stellar RPC endpoint exposes for failed Soroban transactions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sdo-probe"
path = "src/main.rs"

[dependencies]
soroban-failure-analysis.workspace = true
stellar-xdr.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
ureq.workspace = true
chrono = { version = "0.4.45", features = ["clock"] }

[lints.rust]
unsafe_code = "forbid"
